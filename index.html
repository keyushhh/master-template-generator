<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --stage-bg, the desk the slide sits on, so the browser chrome
         continues the app's ground instead of stopping a shade short of it. -->
    <meta name="theme-color" content="#F1F2F4" />
    <meta name="description" content="Wozku Studio turns a business record into branded slides, then exports editable PowerPoint, PDF, images and HTML." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here and falls back to a screenshot of the page as the
         home-screen icon, so this one spot needs a real raster. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable and offline: the app is already fully client-side, so the
         only thing it needed a network for was fetching itself. See public/sw.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wozku Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
